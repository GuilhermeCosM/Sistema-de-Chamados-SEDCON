version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: chamados_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: chamados_db
    ports:
      - "5434:5432"
    volumes:
      - chamados_pgdata:/var/lib/postgresql/data

volumes:
  chamados_pgdata:
